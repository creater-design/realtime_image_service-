network_camera_node:
  ros__parameters:
    stream_url: "http://192.168.1.12:8080/video"
    topic: "/camera/image_raw"
    fps: 60.0
    image_width: 320
    image_height: 240
    reconnect_interval: 2.0
    frame_id: "network_camera"

ros2_tcp_client_node:
  ros__parameters:
    host: "127.0.0.1"
    port: 9999
    topic_name: "/camera/image_raw"
    output_path: ""
    depth_output_path: ""
    max_request_fps: 60.0

safety_controller_node:
  ros__parameters:
    low_speed: 0.20
    medium_speed: 0.05
    stop_on_unknown: true
